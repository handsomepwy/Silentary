# Silentary Nginx reverse-proxy configuration (production HTTPS).
#
# Layout (spec §15): visitor site on 80/443, owner dashboard behind a secret
# URL prefix /admin on the SAME vhost (simplest safe MVP routing; port-8080
# exposure is NOT needed).
#
# Before use:
#   - replace silentary.example.com with your domain
#   - obtain certificates (e.g. certbot --nginx) and the cert paths will be
#     rewritten by certbot automatically
#   - rate limiting also happens at the app layer; this adds coarse limits
#   - set SILENTARY_TRUST_PROXY_HEADERS=true in the app env (this config
#     OVERWRITES X-Forwarded-For with $remote_addr, making it trustworthy)

limit_req_zone $binary_remote_addr zone=silentary_login:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=silentary_api:1m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name silentary.example.com;

    # certbot will add a redirect to HTTPS here
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name silentary.example.com;

    # ssl_certificate     /etc/letsencrypt/live/silentary.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/silentary.example.com/privkey.pem;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 1m;

    # Visitor + owner API (app-level auth + rate limiting apply)
    location /api/ {
        limit_req zone=silentary_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Login endpoint: stricter limit (brute force)
    location = /api/visitor/login {
        limit_req zone=silentary_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Static frontend
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/conf.d/proxy_params;
    }
}
